# 模型笔记：dispatch_prepare 与 Agent Panel 读取此文件；用户在 Agent Panel「模型档位」页维护。
# tag、description 面向模型；effort_note 面向人，只写 Pi 映射之外的实测补充。
# efforts 收窄该模型可选的档位，按 off < minimal < low < medium < high < xhigh < max 排列；推荐行与派发档位只能取其中的值。
# 实际可选档位 = efforts ∩ Pi 支持档；未写 efforts 时取 Pi 支持档。图像输入、档位支持与实际发送值以 Pi 模型目录为准。
# Pi 模型清单里出现的模型都视为可用。

version = 1

[notes."openai-codex/gpt-6.1-sol"]
tag = "工程实现/视觉/审查"
description = "用于常规工程实现、前端视觉与交互、调查、验证和边界核对，也承担可复用工程发现。具体任务分工与推荐档位按角色选型说明；推荐档位不替代用户已保存的硬范围。"

[notes."openai-codex/gpt-6-astra"]
tag = "思考/规划"
description = "深入思考、极高难度实现，以及已确认的拓扑规划、汇总编排和规格颗粒度与跨面审查；用户反馈速度快、没有过度防御。"

[notes."openai-codex/gpt-6-luna"]
tag = "力工/打杂"
description = "力工处理规则和做法已定、执行难度低的正式交付；打杂处理查路径、列清单、收集日志和整理材料等辅助工作。承担已确认的批量、文档和资料研究任务；执行、验收和语义审查岗仅用于编排探针。"

[notes."antigravity/gemini-3.8-flash"]
tag = "快速/纯文字"
description = "速度快，适合量大、要求快的文字活：通读长文档、汇总资料、批量提取要点。通过 Antigravity 订阅调用，这个入口只收文字，看图、看截图、看视频的任务不要派给它。"

[notes."xai/grok-4.6"]
tag = "已退役"
description = "UI设计与视觉实现、疑难排查、竞争解释和约束冲突分析；已确认的具体分工按角色选型说明。"

[notes."xai/grok-4.7"]
tag = "工程实现/调查验证"
description = "承担常规工程实现、调查验证、UI设计与视觉实现、疑难排查、竞争解释和约束冲突分析；长程编码、终端任务和工程推理的公开评测较4.6提升，官方对比多为4.7 xhigh对4.6 high。默认high；AA综合指数high与xhigh均为46，不据此提升跨模型岗位优先级。具体分工按角色选型说明。来源：https://x.ai/news/grok-4-7；https://artificialanalysis.ai/models/grok-4-7。"
